<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4A40">
<title>Mera – prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1F4A40; --pine-2:#2E6A5A; --leaf:#DDEBE3; --paper:#F3F6F4; --white:#FFFFFF;
  --ink:#16241F; --soft:#5A6D66; --line:#DCE4E0; --saffron:#F0B23E; --saffron-bg:#FDF1DA;
  --red:#B23A2B;
  --font:"Onest",system-ui,"Roboto",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:24px}
.app.withdock{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.ribbon{background:var(--saffron-bg);color:#7A5410;font-size:13px;text-align:center;padding:6px 12px}
.screen{padding:12px 18px 24px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
h2{font-size:20px;font-weight:700;margin:22px 0 10px}
.sub{color:var(--soft);font-size:15px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--pine);color:#fff;font-weight:700;display:grid;place-items:center}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--white);border:1px solid var(--line);font-size:20px}

/* dnevna traka */
.days{display:flex;gap:6px;margin:16px -2px 4px;overflow-x:auto}
.day{flex:1;min-width:44px;padding:8px 0 10px;border-radius:14px;text-align:center;background:var(--white);border:1px solid var(--line)}
.day b{display:block;font-size:17px}
.day span{font-size:12px;color:var(--soft)}
.day.on{background:var(--pine);border-color:var(--pine);color:#fff}
.day.on span{color:#cfe2da}

/* zbir dana */
.sum{margin-top:14px;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.big small{font-size:16px;font-weight:600;color:var(--soft)}
.bar{height:10px;border-radius:5px;background:var(--leaf);margin:12px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pine);border-radius:5px}
.sum-meta{display:flex;justify-content:space-between;font-size:14px;color:var(--soft)}
.link{color:var(--pine);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px}

/* obroci – tanjiri */
.meal{display:flex;gap:14px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:12px 12px 12px 12px;margin-bottom:10px}
.plate{flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:32px;position:relative;box-shadow:inset 0 0 0 6px rgba(255,255,255,.75)}
.plate.lg{width:150px;height:150px;font-size:74px;box-shadow:inset 0 0 0 12px rgba(255,255,255,.75)}
.plate.sm{width:44px;height:44px;font-size:21px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.75)}
.t1{background:#F6E3C4}.t2{background:#DDEBD6}.t3{background:#F3D6CF}.t4{background:#D6E6EE}.t5{background:#EDE3F1}
.meal-body{flex:1;min-width:0;display:block;width:100%}
.meal-when{font-size:13px;color:var(--soft)}
.meal-name{font-weight:700;font-size:17px;line-height:1.25;margin:2px 0 4px}
.meal-kcal{font-size:15px}
.meal-kcal b{font-weight:700}
.meal-actions{display:flex;flex-direction:column;gap:8px;align-items:center}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;color:transparent}
.check.done{background:var(--pine);border-color:var(--pine);color:#fff}
.swap{font-size:13px;font-weight:600;color:var(--pine);padding:4px 2px}
.meal.done{background:#F7FAF8}
.meal.done .meal-name{color:var(--soft)}

.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:10px}
.card.accent{background:var(--saffron-bg);border-color:#F2D9A4}
.card.pine{background:var(--pine);border-color:var(--pine);color:#fff}
.card.pine .sub{color:#cfe2da}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:16px;padding:0 20px;font-weight:700;font-size:17px;width:100%}
.btn-p{background:var(--pine);color:#fff}
.btn-s{background:var(--white);border:1.5px solid var(--line)}
.btn-y{background:var(--saffron);color:#3B2A06}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}

/* donja navigacija */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 88px 1fr 1fr;align-items:end;height:72px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--soft);padding-bottom:10px}
.tab .ic{font-size:22px;line-height:1}
.tab.on{color:var(--pine)}
.mic{justify-self:center;width:74px;height:74px;border-radius:50%;background:var(--pine);color:#fff;font-size:30px;display:grid;place-items:center;transform:translateY(-18px);box-shadow:0 8px 22px rgba(31,74,64,.35);border:5px solid var(--paper)}

/* listovi odozdo */
.shade{position:fixed;inset:0;background:rgba(15,30,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:44px;height:5px;border-radius:3px;background:#C6D2CC;margin:4px auto 12px}
.sheet h2{margin-top:4px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--white);border:1.5px solid var(--line);font-size:15px;font-weight:600;display:inline-flex;align-items:center}
.chip.on{background:var(--pine);border-color:var(--pine);color:#fff}

.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.opt.on{border-color:var(--pine);box-shadow:0 0 0 2px var(--pine) inset}
.opt .e{font-size:30px;width:40px;text-align:center}
.opt b{display:block;font-size:17px;color:var(--ink)}
.opt span{font-size:14px;color:var(--soft)}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--leaf);color:var(--pine);padding:3px 8px;border-radius:8px;margin-left:6px;vertical-align:2px}

/* upitnik */
.onb{min-height:calc(100vh - 32px);min-height:calc(100dvh - 32px);display:flex;flex-direction:column;padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.steps{display:flex;gap:5px;margin:6px 0 22px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--pine)}
.onb h1{font-size:28px;line-height:1.15}
.onb .grow{flex:1}
.field{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:10px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.field label{font-size:15px;color:var(--soft)}
.field input{border:0;outline:0;background:none;text-align:right;font-size:24px;font-weight:700;width:120px;color:var(--ink)}
.field em{font-style:normal;color:var(--soft);margin-left:6px}
.seg{display:flex;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:4px;margin-bottom:10px}
.seg button{flex:1;min-height:48px;border-radius:12px;font-weight:600}
.seg button.on{background:var(--pine);color:#fff}
.back{font-weight:600;color:var(--soft);min-height:44px}
.hero{display:flex;gap:10px;margin:30px 0 26px}
.welcome-title{font-size:40px;line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:0 0 14px}

/* recept */
.recipe-top{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.macros div{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.macros b{display:block;font-size:19px}
.macros span{font-size:12px;color:var(--soft)}
.ing{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.step{display:flex;gap:12px;padding:10px 0}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--leaf);color:var(--pine);font-weight:700;display:grid;place-items:center;font-size:15px}

/* kuvanje */
.cook{position:fixed;inset:0;z-index:60;background:var(--pine);color:#fff;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px))}
.cook-text{flex:1;display:flex;align-items:center;font-size:28px;font-weight:600;line-height:1.3}
.cook .btn-s{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.timer{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:14px;padding:12px 16px;font-weight:700;margin-bottom:14px;align-self:flex-start}

/* kupovina */
.shop-sec{font-size:14px;font-weight:700;color:var(--soft);margin:18px 0 6px}
.item{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:0 16px;min-height:56px;margin-bottom:6px;width:100%;text-align:left}
.box{width:26px;height:26px;border-radius:8px;border:2px solid #B9C7C0;display:grid;place-items:center;font-size:15px;color:transparent;flex:none}
.item.done .box{background:var(--pine);border-color:var(--pine);color:#fff}
.item.done .nm{text-decoration:line-through;color:var(--soft)}
.item .nm{flex:1}
.item .q{color:var(--soft);font-size:15px}

/* nedelja */
.wday{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:8px}
.wday .d{width:48px;text-align:center}
.wday .d b{display:block;font-size:20px}
.wday .d span{font-size:12px;color:var(--soft)}
.wday .pl{display:flex;gap:-6px;flex:1}
.wday .pl .plate{margin-right:-8px}
.wday.today{border-color:var(--pine);box-shadow:0 0 0 1.5px var(--pine) inset}

/* napredak */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.stats div{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--soft)}
.chart{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:12px 8px 6px}
.chart svg{width:100%;height:auto;display:block}

/* razgovor */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:84%;padding:12px 14px;border-radius:18px;font-size:16px}
.msg.me{align-self:flex-end;background:var(--pine);color:#fff;border-bottom-right-radius:6px}
.msg.mera{align-self:flex-start;background:var(--white);border:1px solid var(--line);border-bottom-left-radius:6px}
.propose{display:flex;gap:12px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.listen{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 4px}
.listen .mic{transform:none;border-color:var(--paper)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,74,64,.35)}50%{box-shadow:0 0 0 16px rgba(31,74,64,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ja */
.mem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem .x{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--soft);font-size:18px}
.kind{font-size:12px;color:var(--soft)}
.why-row{padding:12px 0;border-bottom:1px solid var(--line)}
.why-row:last-child{border-bottom:0}
.why-row b{display:block;font-size:14px;color:var(--soft);font-weight:600;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:80;font-size:15px;max-width:90%}
.hdr{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 18px 12px;border-bottom:1px solid var(--line)}
.hdr1{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.hdr1 h1{font-size:26px;margin:0;display:flex;align-items:baseline;gap:10px}
.hdr1 .date{color:var(--soft);font-size:15px;font-weight:500;letter-spacing:0}
.hdr1 .avatar{width:40px;height:40px}
.hdr2{display:flex;align-items:center;gap:12px;width:100%;margin-top:6px;min-height:40px;text-align:left;font-size:15px}
.hdr2 .bar{flex:1;margin:0;height:8px}
.hdr2.invite{background:var(--saffron-bg);border-radius:12px;padding:8px 12px;justify-content:space-between;color:#6d5315}
.hdr2 .go{font-weight:700;color:var(--pine)}
.meals{padding:14px 18px 8px}
.badge{position:absolute;top:2px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--saffron)}
.tab{position:relative}
.compose{display:flex;gap:8px;align-items:center;background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:6px 6px 6px 14px}
.compose input{flex:1;border:0;outline:0;background:none;font-size:17px;min-height:44px;color:var(--ink)}
.send{width:44px;height:44px;border-radius:50%;background:var(--pine);color:#fff;font-size:20px;font-weight:700}
.mh{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 16px 12px}
.mh1{display:flex;align-items:center;gap:8px;min-height:52px}
.mh1 .title{font-size:30px;font-weight:800;letter-spacing:-.02em;flex:1}
.ib{position:relative;flex:none;width:52px;height:52px;border-radius:16px;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;font-size:23px}
.ib .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--saffron);border:1.5px solid #fff}
.stat{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:12px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:10px 16px;text-align:left}
.stat .l,.stat .r{white-space:nowrap}
.pill small{display:block;font-size:12px;font-weight:600}
.stat .l b{display:block;font-size:17px;color:var(--pine)}
.stat .l span{font-size:14px;color:var(--soft)}
.stat .r{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat .r small{font-size:14px;font-weight:600;color:var(--soft)}
.stat.invite{background:var(--saffron-bg);border-color:#F2D9A4}
.stat.invite .r{font-size:16px;color:var(--pine);font-weight:700}
.list{padding:2px 16px 16px}
.mc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:12px 14px;margin-bottom:10px}
.mc .mid{flex:1;min-width:0}
.mc .plate{width:58px;height:58px;font-size:28px}
.mc .nm{font-size:17px;font-weight:600;line-height:1.25}
.mc .ds{font-size:14px;color:var(--soft);margin-top:3px}
.pill{flex:none;min-width:64px;text-align:center;padding:7px 8px;border-radius:14px;line-height:1.15;background:var(--leaf);color:var(--pine);font-weight:700;font-size:15px}
.pill.ok{background:var(--pine);color:#fff}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:480px;margin:0 auto}
.dock input{width:100%;min-height:52px;border-radius:26px;border:1.5px solid var(--line);background:var(--white);padding:0 20px;font-size:17px;color:var(--ink);outline:0}
.dock-row{display:flex;gap:12px;align-items:center;margin-top:10px}
.round{flex:none;width:56px;height:56px;border-radius:50%;background:var(--white);border:1.5px solid var(--line);display:grid;place-items:center;font-size:22px;color:var(--pine)}
.go-btn{flex:1;height:56px;border-radius:28px;background:var(--pine);color:#fff;font-size:24px;display:grid;place-items:center}
.sh{display:flex;align-items:center;gap:8px;padding:14px 12px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:5}
.sh button.bk{width:48px;height:48px;font-size:30px;color:var(--ink)}
.sh h1{font-size:24px;margin:0;flex:1}
.sh .sub{font-size:14px}
.set{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.set .e{font-size:30px;width:40px;text-align:center}
.set .mid{flex:1}
.set b{display:block;font-size:18px}
.set span.d{font-size:14px;color:var(--soft)}
.set .ch{color:var(--soft);font-size:22px}
.set.danger b{color:var(--red)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script>
// PROTOTIP IZGLEDA. Svi brojevi, obroci i merenja su izmišljeni primeri samo za pregled izgleda i toka.
// Ništa odavde se ne koristi u aplikaciji; prava aplikacija broji isključivo iz proverenih podataka.
const S = {
  view: "welcome", step: 0, tab: "danas", sheet: null, cook: null, toast: null,
  a: { goal: "lose", sex: "m", age: "52", h: "180", kg: "94", act: "stand", pace: "mod", target: "85", meals: "3", no: ["Riba"], time: "30" },
  eaten: { d: true }, profile: false, bought: {}, hideBought: false, chat: [], listening: false, checkin: "open", mem: null
};
const MEALS = {
  d: { when: "Doručak", time: "8:00", name: "Omlet sa povrćem i integralnim hlebom", e: "🍳", t: "t1", kcal: 480, p: 32, f: 22, c: 36, min: 15 },
  r: { when: "Ručak", time: "14:00", name: "Piletina u sosu od paprike sa pirinčem", e: "🍗", t: "t3", kcal: 720, p: 52, f: 18, c: 82, min: 30 },
  u: { when: "Užina", time: "17:30", name: "Grčki jogurt sa jabukom i orasima", e: "🥣", t: "t5", kcal: 260, p: 18, f: 11, c: 22, min: 5 },
  v: { when: "Večera", time: "20:00", name: "Salata sa junetinom, leblebijom i pečenim povrćem", e: "🥗", t: "t2", kcal: 390, p: 34, f: 16, c: 26, min: 25 }
};
const ALT = [
  { name: "Ćuretina sa pečenim krompirom i salatom", e: "🥔", t: "t1", kcal: 700, p: 50, min: 35, why: "isti proteini" },
  { name: "Pasulj sa junećim mesom", e: "🫘", t: "t3", kcal: 690, p: 44, min: 20, why: "od juče ostalo" },
  { name: "Integralna pasta sa ćuretinom i paradajzom", e: "🍝", t: "t4", kcal: 730, p: 47, min: 20, why: "brže" }
];
const TARGET = 1850;
const $ = (h) => h;

function kcalEaten() { return Object.keys(S.eaten).filter(k => S.eaten[k]).reduce((s, k) => s + MEALS[k].kcal, 0); }
function protEaten() { return Object.keys(S.eaten).filter(k => S.eaten[k]).reduce((s, k) => s + MEALS[k].p, 0); }

function chart() {
  const pts = [94.0,93.6,93.9,93.4,93.5,93.1,93.3,92.9,93.0,92.6,92.8,92.3,92.5,92.2,92.4,92.0,91.9,92.1,91.7,91.8,91.4,91.6,91.3,91.5,91.1,91.2,90.9,91.6];
  const W = 340, H = 170, min = 90.4, max = 94.4, x = i => 14 + i * (W - 28) / (pts.length - 1), y = v => 12 + (max - v) / (max - min) * (H - 34);
  const dots = pts.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="#9DB5AB"/>`).join("");
  const n = pts.length, mx = (n - 1) / 2, my = pts.reduce((s, v) => s + v, 0) / n;
  const b = pts.reduce((s, v, i) => s + (i - mx) * (v - my), 0) / pts.reduce((s, _, i) => s + (i - mx) ** 2, 0), a = my - b * mx;
  const line = `<line x1="${x(0)}" y1="${y(a)}" x2="${x(pts.length-1)}" y2="${y(a + b*(pts.length-1))}" stroke="#1F4A40" stroke-width="3.5" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Masa poslednje 4 nedelje: tačke su dnevna merenja, linija je trend">
    ${[92,94].map(v => `<line x1="10" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#E6ECE9"/><text x="${W-10}" y="${y(v)-4}" text-anchor="end" font-size="11" fill="#5A6D66">${v} kg</text>`).join("")}
    ${dots}${line}
    <text x="14" y="${H-4}" font-size="11" fill="#5A6D66">29. avg</text><text x="${W-14}" y="${H-4}" text-anchor="end" font-size="11" fill="#5A6D66">danas</text>
  </svg>`;
}

      <div class="why-row"><b>Trend mase</b>−0,6 kg nedeljno u poslednje 4 nedelje (24 merenja).</div>
      <div class="why-row"><b>Plan</b>Oko −0,5 kg nedeljno. Razlika je mala i u sigurnim granicama.</div>
      <div class="why-row"><b>Pridržavanje</b>6 od 7 dana potvrđeno kao pojedeno.</div>
      <div class="why-row"><b>Pravilo</b>Promena se predlaže tek kad se trend jasno i duže vreme razlikuje od plana.</div></div>`;
  if (kind === "memory") {
    const mem = S.mem || (S.mem = [["Ne jede ribu","trajno"],["Kuva najviše 30 minuta","trajno, osim kad kaže drugačije"],["Ručak oko 14 h","navika"],["Ne voli pečurke","trajno"],["Nema piletinu kod kuće","samo danas"]]);
    return `<h2>Šta Mera pamti</h2><div class="card">${mem.map(([t,k],i) => `<div class="mem"><div style="flex:1"><div>${t}</div><div class="kind">${k}</div></div><button class="x" data-forget="${i}" aria-label="Zaboravi">✕</button></div>`).join("")}</div><p class="sub">Mera ovo uči iz razgovora. Sve možeš da obrišeš.</p>`;
  }
  if (kind === "add") return `<h2>Dodaj</h2>
      <button class="set" data-sheet="ate-other"><span class="e">🍴</span><span class="mid"><b>pojeo sam nešto drugo</b><span class="d">van plana</span></span><span class="ch">›</span></button>
      <button class="set" data-sheet="weigh"><span class="e">⚖️</span><span class="mid"><b>masa jutros</b><span class="d">poslednje: 91,6 kg, juče</span></span><span class="ch">›</span></button>
      <button class="set" data-toast="Skeniranje barkoda: kasniji korak."><span class="e">▥</span><span class="mid"><b>skeniraj proizvod</b><span class="d">barkod sa pakovanja</span></span><span class="ch">›</span></button>`;
  if (kind === "weigh") return `<h2>Masa jutros</h2>
      <div class="field"><label>Masa</label><span><input inputmode="decimal" value="91,4" autofocus><em>kg</em></span></div>
      <p class="sub">Najbolje ujutru, posle toaleta, pre doručka.</p>
      <div class="btn-row"><button class="btn btn-p" data-close data-toast-after="Sačuvano. Trend se računa iz više dana, ne iz jednog merenja.">Sačuvaj</button></div>`;
  if (kind === "ate-other") return `<h2>Šta si pojeo?</h2>
      <p class="sub" style="margin-bottom:12px">Napiši svojim rečima ili diktiraj preko tastature, npr. „tanjir pasulja i parče hleba“.</p>
      <button class="btn btn-p" data-chat="Za ručak sam pojeo tanjir pasulja i parče hleba">Primer: tanjir pasulja i hleb</button>`;
  return "";
}

/* ---------- RAZGOVOR ---------- */
function chatHtml() {
  const sugg = ["Promeni večeru","Nemam piletinu","Danas imam samo 15 minuta","Ovo mi je preskupo","Pojeo sam nešto drugo"];
  return `<h2>Pitaj Meru</h2>
    <div class="chat">${S.chat.length ? S.chat.map(m => m.me ? `<div class="msg me">${m.t}</div>` : `<div class="msg mera">${m.t}${m.p ? `<div class="propose"><span class="plate sm ${m.p.t}">${m.p.e}</span><span style="flex:1"><b>${m.p.name}</b><br><span class="sub">${m.p.kcal} kcal, ${m.p.min} min</span></span></div><div class="btn-row"><button class="btn btn-p" data-accept>Prihvati</button><button class="btn btn-s" data-chat="Nešto drugo">Drugo</button></div>` : ""}</div>`).join("") : `<p class="sub">Piši normalno, kao nutricionisti. Na primer:</p>`}</div>
    ${S.chat.length ? "" : `<div class="chips" style="margin-bottom:16px">${sugg.map(s => `<button class="chip" data-chat="${s}">${s}</button>`).join("")}</div>`}
    <div class="compose"><input id="chat-in" placeholder="Napiši ili diktiraj" enterkeyhint="send"><button class="send" data-send aria-label="Pošalji">↑</button></div>
    <p class="sub" style="font-size:13px;margin:8px 4px 0">Za govor koristi mikrofon na tastaturi telefona.</p>`;
}
function reply(t) {
  const x = t.toLowerCase();
  if (x.includes("piletin")) return { t: "Važi, danas bez piletine. Za ručak predlažem ovo, isto se uklapa u tvoj dan:", p: ALT[0] };
  if (x.includes("15")) return { t: "Za danas biram jela do 15 minuta. Ručak menjam u:", p: { name: "Tortilja sa ćuretinom, sirom i povrćem", e: "🌯", t: "t4", kcal: 690, min: 12 } };
  if (x.includes("skup")) return { t: "Razumem, pamtim da ti je budžet bitan. Umesto junetine predlažem:", p: { name: "Salata sa jajima, leblebijom i pečenim povrćem", e: "🥗", t: "t2", kcal: 400, min: 20 } };
  if (x.includes("drugo") && x.includes("pojeo")) return { t: "Reci mi šta si pojeo i otprilike koliko, npr. „tanjir pasulja i parče hleba“." };
  if (x.includes("pasulj")) return { t: "Upisao sam: pasulj, oko 350 g, i hleb, oko 60 g. Ukupno ≈ 520 kcal (procena, jer je količina od oka). Tačno?" };
  if (x.includes("drugo")) return { t: "Evo još jedne opcije:", p: ALT[2] };
  return { t: "Evo predloga za večeru, uklapa se u ostatak dana:", p: ALT[1] };
}

/* ---------- KUVANJE ---------- */
const STEPS = ["Skuvaj pirinač prema uputstvu na pakovanju.","Iseci piletinu na kocke, a papriku i luk na trake.","Na ulju prži luk 3 minuta, dodaj piletinu i peci dok ne porumeni.","Dodaj papriku i malo vode, pa kuvaj 10 minuta poklopljeno."];
function cookHtml() {
  const i = S.cook;
  return `<div class="cook">
    <div class="row"><span style="opacity:.8">Korak ${i+1} od ${STEPS.length}</span><button class="icon-btn" style="background:transparent;border-color:rgba(255,255,255,.4);color:#fff" data-cook-close aria-label="Zatvori">✕</button></div>
    <div class="steps" style="margin-top:14px">${STEPS.map((_,j) => `<i style="background:${j<=i?"#F0B23E":"rgba(255,255,255,.25)"}"></i>`).join("")}</div>
    <div class="cook-text">${STEPS[i]}</div>
    ${i===2||i===3 ? `<button class="timer" data-toast="Tajmer pokrenut">⏱ ${i===2?"3:00":"10:00"} pokreni tajmer</button>` : ""}
    <div class="btn-row"><button class="btn btn-s" data-cook-step="-1" ${i===0?"disabled style='opacity:.4'":""}>Nazad</button><button class="btn btn-y" data-cook-step="1">${i===STEPS.length-1?"Gotovo":"Sledeći"}</button></div>
    <p style="text-align:center;opacity:.75;font-size:14px;margin:12px 0 0">Ekran ostaje upaljen. Možeš reći „sledeći“.</p>
  </div>`;
}

/* ---------- RENDER ---------- */
function render() {
  let h = `<div class="ribbon">Prototip izgleda. Svi brojevi i jela su primer, nisu stvarni.</div>`;
  if (S.view === "welcome") h += renderWelcome();
  else if (S.view === "onb") h += renderOnb();
  else {
    const T = { danas: renderDanas, nedelja: renderNedelja, kupovina: renderKupovina, napredak: renderNapredak, ja: renderJa };
    h += `<div class="app ${S.tab==="danas" ? "withdock" : ""}">${T[S.tab]()}</div>`;
    if (S.tab === "danas") h += dockHtml();
  }
  if (S.sheet) h += `<div class="shade" data-shade><div class="sheet" role="dialog"><div class="grab"></div>${S.sheet === "chat" ? chatHtml() : sheetHtml()}</div></div>`;
  if (S.cook !== null) h += cookHtml();
  if (S.toast) h += `<div class="toast">${S.toast}</div>`;
  const keepScroll = document.querySelector(".sheet")?.scrollTop;
  document.getElementById("root").innerHTML = h;
  if (keepScroll && document.querySelector(".sheet")) document.querySelector(".sheet").scrollTop = keepScroll;
}
function toast(t) { S.toast = t; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; render(); }, 2600); }

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("button,[data-shade]");
  if (!el) return;
  const d = el.dataset;
  if ("shade" in d) { if (ev.target === el) { S.sheet = null; S.listening = false; render(); } return; }
  if ("dockSend" in d) { const v = (document.getElementById("dock-in")?.value || "").trim(); if (!v) return; S.sheet = "chat"; S.chat = [{ me: true, t: v }, reply(v)]; }
  else if ("enter" in d) { S.view = "app"; S.tab = "danas"; }
  else if ("send" in d) { const v = (document.getElementById("chat-in")?.value || "").trim(); if (!v) return; S.chat.push({ me: true, t: v }); S.chat.push(reply(v)); }
  else if (d.go === "onb") { S.view = "onb"; S.step = 0; S.sheet = null; }
  else if ("next" in d) { if (S.step < ONB.length - 1) S.step++; else { S.view = "app"; S.tab = "danas"; S.profile = true; } scrollTo(0,0); }
  else if ("back" in d) { if (S.step > 0) S.step--; else S.view = "app"; }
  else if (d.set) { const [k, v] = d.set.split(":"); S.a[k] = v; }
  else if (d.toggleNo) { const v = d.toggleNo; S.a.no = S.a.no.includes(v) ? S.a.no.filter(x => x !== v) : [...S.a.no, v]; }
  else if (d.tab) { S.tab = d.tab; S.sheet = null; scrollTo(0,0); }
  else if (d.sheet) { S.sheet = d.sheet; }
  else if (d.eat) { S.eaten[d.eat] = !S.eaten[d.eat]; if ("close" in d) S.sheet = null; }
  else if (d.pick) { const [k, i] = d.pick.split(":"); Object.assign(MEALS[k], ALT[+i]); S.sheet = null; return toast("Zamenjeno. Dan je i dalje u cilju."); }
  else if (d.buy) { S.bought[d.buy] = !S.bought[d.buy]; }
  else if (d.hide) { S.hideBought = d.hide === "1"; }
  else if (d.checkin) { S.checkin = "done"; return toast("Plan ostaje isti. Sledeći pregled za nedelju dana."); }
  else if (d.forget) { S.mem.splice(+d.forget, 1); return toast("Zaboravljeno."); }
  else if (d.chat) { S.sheet = "chat"; S.chat.push({ me: true, t: d.chat }); S.chat.push(reply(d.chat)); }
  else if ("listen" in d) { if (!S.listening) { S.listening = true; render(); setTimeout(() => { if (!S.listening) return; S.listening = false; S.chat.push({ me: true, t: "Promeni večeru" }); S.chat.push(reply("večer")); render(); }, 1800); return; } S.listening = false; }
  else if ("accept" in d) { S.sheet = null; return toast("Prihvaćeno. Jelovnik je ažuriran."); }
  else if (d.cook !== undefined && d.cook !== "") { S.cook = 0; S.sheet = null; }
  else if (d.cookStep) { const n = S.cook + +d.cookStep; if (n >= STEPS.length) { S.cook = null; return toast("Prijatno! Obrok je označen kao pojeden."); } S.cook = Math.max(0, n); }
  else if ("cookClose" in d) { S.cook = null; }
  else if ("close" in d) { S.sheet = null; if (d.toastAfter) return toast(d.toastAfter); }
  else if (d.toast) { return toast(d.toast); }
  render();
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.id === "chat-in") document.querySelector("[data-send]")?.click(); if (ev.key === "Enter" && ev.target.id === "dock-in") document.querySelector("[data-dock-send]")?.click(); });
document.addEventListener("input", (ev) => { const k = ev.target.dataset.in; if (k) S.a[k] = ev.target.value; });
render();
</script>
</body>
</html>
